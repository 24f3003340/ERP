name: Tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp_pass, POSTGRES_DB: erp_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: SQLite
        run: cd backend && python -m pytest -q
      - name: PostgreSQL
        run: cd backend && python -m pytest -q
        env: { ERP_DATABASE_URL: "postgresql+psycopg2://erp:erp_pass@localhost:5432/erp_test" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm ci && npm run build
