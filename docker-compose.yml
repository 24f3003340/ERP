# Optional: PostgreSQL for multi-computer LAN mode.
#   docker compose up -d
#   ERP_DATABASE_URL=postgresql+psycopg2://erp:erp_pass@localhost:5432/erp ./run.sh
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_pass
      POSTGRES_DB: erp
    ports: ["127.0.0.1:5432:5432"]
    volumes: [erp_pg:/var/lib/postgresql/data]
volumes:
  erp_pg:
